<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050"><rect width="100%" height="100%" fill="white"/><text x="700" y="42" text-anchor="middle" font-family="Noto Sans Thai, sans-serif" font-size="30" font-weight="700">Expression Processor (Infix &amp; Postfix) - Class Diagram</text><text x="700" y="73" text-anchor="middle" font-family="Noto Sans Thai, sans-serif" font-size="18" fill="#555">อ้างอิงจากโครงสร้าง Java ล่าสุด</text><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker></defs><rect x="40" y="105" width="390" height="250" rx="14" fill="#e8f7eb" stroke="#46596b" stroke-width="2"/><line x1="40" y1="153" x2="430" y2="153" stroke="#46596b" stroke-width="2"/><text x="235" y="136" text-anchor="middle" font-family="Noto Sans Thai, sans-serif" font-size="21" font-weight="700">Main</text><text x="58" y="183" font-family="Noto Sans Thai, sans-serif" font-size="16">- scanner : Scanner</text><text x="58" y="215" font-family="Noto Sans Thai, sans-serif" font-size="16">+ main(args: String[]) : void</text><text x="58" y="239" font-family="Noto Sans Thai, sans-serif" font-size="16">- printMenu() : void</text><text x="58" y="263" font-family="Noto Sans Thai, sans-serif" font-size="16">- runAlgorithm(...) : void</text><text x="58" y="287" font-family="Noto Sans Thai, sans-serif" font-size="16">- runMandatoryTests(...) : void</text><rect x="470" y="105" width="410" height="290" rx="14" fill="#e8f2ff" stroke="#46596b" stroke-width="2"/><line x1="470" y1="153" x2="880" y2="153" stroke="#46596b" stroke-width="2"/><text x="675" y="136" text-anchor="middle" font-family="Noto Sans Thai, sans-serif" font-size="21" font-weight="700">AlgorithmA</text><text x="488" y="183" font-family="Noto Sans Thai, sans-serif" font-size="15">+ evaluate(expression) : ExpressionResult</text><text x="488" y="207" font-family="Noto Sans Thai, sans-serif" font-size="15">+ infixToPostfix(tokens, counter) : List&lt;String&gt;</text><text x="488" y="231" font-family="Noto Sans Thai, sans-serif" font-size="15">+ evaluatePostfix(postfix, counter) : double</text><text x="488" y="255" font-family="Noto Sans Thai, sans-serif" font-size="15">- calculate(a, op, b) : double</text><text x="488" y="279" font-family="Noto Sans Thai, sans-serif" font-size="15">+ traceEvaluate(expression) : void</text><rect x="920" y="105" width="440" height="290" rx="14" fill="#f4edff" stroke="#46596b" stroke-width="2"/><line x1="920" y1="153" x2="1360" y2="153" stroke="#46596b" stroke-width="2"/><text x="1140" y="136" text-anchor="middle" font-family="Noto Sans Thai, sans-serif" font-size="21" font-weight="700">AlgorithmB</text><text x="938" y="183" font-family="Noto Sans Thai, sans-serif" font-size="15">+ evaluate(expression) : ExpressionResult</text><text x="938" y="207" font-family="Noto Sans Thai, sans-serif" font-size="15">+ evaluateInfix(tokens, counter) : double</text><text x="938" y="231" font-family="Noto Sans Thai, sans-serif" font-size="15">- applyTopOperator(...) : void</text><text x="938" y="255" font-family="Noto Sans Thai, sans-serif" font-size="15">- calculate(a, op, b) : double</text><text x="938" y="279" font-family="Noto Sans Thai, sans-serif" font-size="15">+ traceEvaluate(expression) : void</text><rect x="40" y="450" width="390" height="270" rx="14" fill="#eef8ff" stroke="#46596b" stroke-width="2"/><line x1="40" y1="498" x2="430" y2="498" stroke="#46596b" stroke-width="2"/><text x="235" y="481" text-anchor="middle" font-family="Noto Sans Thai, sans-serif" font-size="21" font-weight="700">Tokenizer</text><text x="58" y="530" font-family="Noto Sans Thai, sans-serif" font-size="15">+ tokenize(expression) : List&lt;String&gt;</text><text x="58" y="554" font-family="Noto Sans Thai, sans-serif" font-size="15">+ validateTokens(tokens) : void</text><text x="58" y="578" font-family="Noto Sans Thai, sans-serif" font-size="15">+ isOperator(token) : boolean</text><text x="58" y="602" font-family="Noto Sans Thai, sans-serif" font-size="15">+ isNumber(token) : boolean</text><text x="58" y="626" font-family="Noto Sans Thai, sans-serif" font-size="15">+ priority(operator) : int</text><rect x="470" y="450" width="410" height="300" rx="14" fill="#eef5fc" stroke="#46596b" stroke-width="2"/><line x1="470" y1="498" x2="880" y2="498" stroke="#46596b" stroke-width="2"/><text x="675" y="481" text-anchor="middle" font-family="Noto Sans Thai, sans-serif" font-size="21" font-weight="700">OperationCounter</text><text x="488" y="530" font-family="Noto Sans Thai, sans-serif" font-size="15">- pushCount : long</text><text x="488" y="554" font-family="Noto Sans Thai, sans-serif" font-size="15">- popCount : long</text><text x="488" y="578" font-family="Noto Sans Thai, sans-serif" font-size="15">- comparisonCount : long</text><text x="488" y="602" font-family="Noto Sans Thai, sans-serif" font-size="15">- loopCount : long</text><text x="488" y="634" font-family="Noto Sans Thai, sans-serif" font-size="15">+ incrementPush/Pop/Comparison/Loop()</text><text x="488" y="658" font-family="Noto Sans Thai, sans-serif" font-size="15">+ getPushCount() / getPopCount()</text><text x="488" y="682" font-family="Noto Sans Thai, sans-serif" font-size="15">+ getComparisonCount() / getLoopCount()</text><rect x="920" y="450" width="440" height="330" rx="14" fill="#fff0f3" stroke="#46596b" stroke-width="2"/><line x1="920" y1="498" x2="1360" y2="498" stroke="#46596b" stroke-width="2"/><text x="1140" y="481" text-anchor="middle" font-family="Noto Sans Thai, sans-serif" font-size="21" font-weight="700">ExpressionResult</text><text x="938" y="530" font-family="Noto Sans Thai, sans-serif" font-size="15">- success : boolean</text><text x="938" y="554" font-family="Noto Sans Thai, sans-serif" font-size="15">- value : double</text><text x="938" y="578" font-family="Noto Sans Thai, sans-serif" font-size="15">- postfix : String</text><text x="938" y="602" font-family="Noto Sans Thai, sans-serif" font-size="15">- errorMessage : String</text><text x="938" y="626" font-family="Noto Sans Thai, sans-serif" font-size="15">- elapsedTimeNanos : long</text><text x="938" y="650" font-family="Noto Sans Thai, sans-serif" font-size="15">- counter : OperationCounter</text><text x="938" y="682" font-family="Noto Sans Thai, sans-serif" font-size="15">+ success(...) : ExpressionResult</text><text x="938" y="706" font-family="Noto Sans Thai, sans-serif" font-size="15">+ error(...) : ExpressionResult</text><text x="938" y="730" font-family="Noto Sans Thai, sans-serif" font-size="15">+ isSuccess(), getValue(), getPostfix()</text><text x="938" y="754" font-family="Noto Sans Thai, sans-serif" font-size="15">+ getErrorMessage(), getElapsedTimeNanos(), getCounter()</text><line x1="235" y1="355" x2="235" y2="450" stroke="#555" stroke-width="2" marker-end="url(#arr)"/><text x="245" y="410" font-family="Noto Sans Thai, sans-serif" font-size="14" font-weight="700" fill="#555">use</text><line x1="430" y1="230" x2="470" y2="570" stroke="#555" stroke-width="2" marker-end="url(#arr)"/><text x="445" y="395" font-family="Noto Sans Thai, sans-serif" font-size="14" font-weight="700" fill="#555">use</text><line x1="675" y1="395" x2="675" y2="450" stroke="#555" stroke-width="2" marker-end="url(#arr)"/><text x="688" y="425" font-family="Noto Sans Thai, sans-serif" font-size="14" font-weight="700" fill="#555">use</text><line x1="1140" y1="395" x2="1140" y2="450" stroke="#555" stroke-width="2" marker-end="url(#arr)"/><text x="1152" y="425" font-family="Noto Sans Thai, sans-serif" font-size="14" font-weight="700" fill="#555">use</text><line x1="880" y1="250" x2="920" y2="620" stroke="#555" stroke-width="2" marker-end="url(#arr)"/><text x="890" y="430" font-family="Noto Sans Thai, sans-serif" font-size="14" font-weight="700" fill="#555">returns</text><line x1="1140" y1="395" x2="1200" y2="450" stroke="#555" stroke-width="2" marker-end="url(#arr)"/><text x="1170" y="420" font-family="Noto Sans Thai, sans-serif" font-size="14" font-weight="700" fill="#555">returns</text><rect x="40" y="815" width="1320" height="170" rx="14" fill="#f8f8f8" stroke="#bbb" stroke-width="2"/><text x="65" y="850" font-family="Noto Sans Thai, sans-serif" font-size="20" font-weight="700">หมายเหตุ</text><text x="70" y="885" font-family="Noto Sans Thai, sans-serif" font-size="16">• ยึดชื่อ class / method / field จากโค้ด Java จริง</text><text x="70" y="913" font-family="Noto Sans Thai, sans-serif" font-size="16">• Tokenizer เป็น utility class และใช้ static methods</text><text x="70" y="941" font-family="Noto Sans Thai, sans-serif" font-size="16">• Algorithm A และ B คืนค่า ExpressionResult และ BenchmarkExperiment เป็นคลาสแยก</text></svg>