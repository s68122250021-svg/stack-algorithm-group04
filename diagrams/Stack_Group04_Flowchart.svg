<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100"><rect width="100%" height="100%" fill="white"/><text x="700" y="45" text-anchor="middle" font-family="Noto Sans Thai, sans-serif" font-size="30" font-weight="700">Expression Processor - Flowchart</text><text x="700" y="78" text-anchor="middle" font-family="Noto Sans Thai, sans-serif" font-size="18" fill="#555">Algorithm A และ Algorithm B (ใช้ Yes / No)</text><rect x="510" y="115" width="380" height="90" rx="14" fill="#e8f7eb" stroke="#46596b" stroke-width="2"/><line x1="510" y1="163" x2="890" y2="163" stroke="#46596b" stroke-width="2"/><text x="700" y="146" text-anchor="middle" font-family="Noto Sans Thai, sans-serif" font-size="21" font-weight="700">Start / Input</text><text x="526" y="188" font-family="Noto Sans Thai, sans-serif" font-size="16" fill="#333">รับ Infix expression</text><line x1="700" y1="205" x2="700" y2="235" stroke="#555" stroke-width="2" marker-end="url(#arr)"/><rect x="510" y="235" width="380" height="90" rx="14" fill="#eef8ff" stroke="#46596b" stroke-width="2"/><line x1="510" y1="283" x2="890" y2="283" stroke="#46596b" stroke-width="2"/><text x="700" y="266" text-anchor="middle" font-family="Noto Sans Thai, sans-serif" font-size="21" font-weight="700">Tokenize</text><text x="526" y="308" font-family="Noto Sans Thai, sans-serif" font-size="16" fill="#333">สร้างรายการ Tokens</text><line x1="700" y1="325" x2="700" y2="355" stroke="#555" stroke-width="2" marker-end="url(#arr)"/><rect x="510" y="355" width="380" height="100" rx="14" fill="#fff7df" stroke="#46596b" stroke-width="2"/><line x1="510" y1="403" x2="890" y2="403" stroke="#46596b" stroke-width="2"/><text x="700" y="386" text-anchor="middle" font-family="Noto Sans Thai, sans-serif" font-size="21" font-weight="700">Validate Input</text><text x="526" y="428" font-family="Noto Sans Thai, sans-serif" font-size="16" fill="#333">ตรวจ Operand / Operator / Parentheses</text><rect x="80" y="540" width="570" height="270" rx="14" fill="#e8f2ff" stroke="#46596b" stroke-width="2"/><line x1="80" y1="588" x2="650" y2="588" stroke="#46596b" stroke-width="2"/><text x="365" y="571" text-anchor="middle" font-family="Noto Sans Thai, sans-serif" font-size="21" font-weight="700">Algorithm A</text><text x="96" y="613" font-family="Noto Sans Thai, sans-serif" font-size="16">1. Operator Stack</text><text x="96" y="637" font-family="Noto Sans Thai, sans-serif" font-size="16">2. ตรวจ Priority</text><text x="96" y="661" font-family="Noto Sans Thai, sans-serif" font-size="16">3. Infix -&gt; Postfix</text><text x="96" y="685" font-family="Noto Sans Thai, sans-serif" font-size="16">4. Evaluate Postfix ด้วย Operand Stack</text><text x="96" y="709" font-family="Noto Sans Thai, sans-serif" font-size="16">5. คืน ExpressionResult</text><rect x="750" y="540" width="570" height="270" rx="14" fill="#f4edff" stroke="#46596b" stroke-width="2"/><line x1="750" y1="588" x2="1320" y2="588" stroke="#46596b" stroke-width="2"/><text x="1035" y="571" text-anchor="middle" font-family="Noto Sans Thai, sans-serif" font-size="21" font-weight="700">Algorithm B</text><text x="766" y="613" font-family="Noto Sans Thai, sans-serif" font-size="16">1. Operand Stack + Operator Stack</text><text x="766" y="637" font-family="Noto Sans Thai, sans-serif" font-size="16">2. ตรวจ Priority</text><text x="766" y="661" font-family="Noto Sans Thai, sans-serif" font-size="16">3. applyTopOperator เมื่อถึงจังหวะคำนวณ</text><text x="766" y="685" font-family="Noto Sans Thai, sans-serif" font-size="16">4. Evaluate Infix โดยตรง</text><text x="766" y="709" font-family="Noto Sans Thai, sans-serif" font-size="16">5. คืน ExpressionResult</text><line x1="700" y1="455" x2="365" y2="540" stroke="#555" stroke-width="2" marker-end="url(#arr)"/><text x="530" y="492" text-anchor="middle" font-family="Noto Sans Thai, sans-serif" font-size="14" font-weight="700" fill="#555">Yes: A</text><line x1="700" y1="455" x2="1035" y2="540" stroke="#555" stroke-width="2" marker-end="url(#arr)"/><text x="870" y="492" text-anchor="middle" font-family="Noto Sans Thai, sans-serif" font-size="14" font-weight="700" fill="#555">Yes: B</text><rect x="80" y="860" width="570" height="85" rx="14" fill="#e8f7eb" stroke="#46596b" stroke-width="2"/><text x="365" y="894" text-anchor="middle" font-family="Noto Sans Thai, sans-serif" font-size="21" font-weight="700">Success</text><text x="365" y="922" text-anchor="middle" font-family="Noto Sans Thai, sans-serif" font-size="16">แสดง Result + Time + Operation</text><rect x="750" y="860" width="570" height="85" rx="14" fill="#e8f7eb" stroke="#46596b" stroke-width="2"/><text x="1035" y="894" text-anchor="middle" font-family="Noto Sans Thai, sans-serif" font-size="21" font-weight="700">Success</text><text x="1035" y="922" text-anchor="middle" font-family="Noto Sans Thai, sans-serif" font-size="16">แสดง Result + Time + Operation</text><line x1="365" y1="810" x2="365" y2="860" stroke="#555" stroke-width="2" marker-end="url(#arr)"/><line x1="1035" y1="810" x2="1035" y2="860" stroke="#555" stroke-width="2" marker-end="url(#arr)"/><rect x="510" y="980" width="380" height="75" rx="14" fill="#ffecec" stroke="#46596b" stroke-width="2"/><text x="700" y="1011" text-anchor="middle" font-family="Noto Sans Thai, sans-serif" font-size="21" font-weight="700">Error</text><text x="700" y="1037" text-anchor="middle" font-family="Noto Sans Thai, sans-serif" font-size="15">Input ไม่ถูกต้อง / วงเล็บไม่ครบ / หารด้วยศูนย์</text><line x1="510" y1="405" x2="700" y2="980" stroke="#555" stroke-width="2" marker-end="url(#arr)"/><text x="550" y="720" font-family="Noto Sans Thai, sans-serif" font-size="14" font-weight="700" fill="#555">No / Error</text><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker></defs></svg>